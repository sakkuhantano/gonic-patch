name: Build and test gonic patch

on:
  push:
    branches:
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build patched gonic image
        run: docker build --pull --file Dockerfile.gonic --tag gonic-patch-ci:latest .

      - name: Smoke-test gonic binary
        run: docker run --rm gonic-patch-ci:latest /usr/local/bin/gonic --help
