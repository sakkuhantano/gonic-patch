[program:hermes-gateway]
command=/usr/local/bin/hermes-gateway-supervisor.sh
directory=/workspace
autostart=true
autorestart=true
startsecs=5
startretries=999
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/var/log/app_logs/hermes-gateway.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/app_logs/hermes-gateway-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
